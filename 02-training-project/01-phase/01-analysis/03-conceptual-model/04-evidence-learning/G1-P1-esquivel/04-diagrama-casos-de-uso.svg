<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 790" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow-include" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#2563eb" stroke-width="1.8" />
    </marker>
    <marker id="arrow-extend" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#d97706" stroke-width="1.8" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1320" height="790" fill="#f8fafc" />

  <!-- ================= FRONTERA DEL SISTEMA ================= -->
  <rect x="180" y="25" width="855" height="740" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 4" filter="url(#shadow)" />
  <rect x="180" y="25" width="490" height="34" rx="6" fill="#0284c7" />
  <text x="195" y="47" font-size="13" font-weight="bold" fill="#ffffff">Sistema Nuvora — Centro Comercial San Pedro Plaza</text>

  <!-- Subtítulos de módulos -->
  <text x="205" y="76" font-size="11" font-weight="bold" fill="#0369a1" letter-spacing="0.5">MÓDULO VISITANTE &amp; CONSUMIDOR</text>
  <text x="1010" y="76" text-anchor="end" font-size="11" font-weight="bold" fill="#0369a1" letter-spacing="0.5">MÓDULO LOCATARIO, CAJERO &amp; MALL</text>

  <!-- ================= COLUMNA 1: VISITANTE (cx=310) ================= -->
  <g id="cu-01">
    <ellipse cx="310" cy="115" rx="108" ry="26" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
    <text x="310" y="119" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">CU-01: Registrar usuario visitante</text>
  </g>

  <g id="cu-03">
    <ellipse cx="310" cy="205" rx="108" ry="27" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
    <text x="310" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">CU-03: Consultar catálogo de</text>
    <text x="310" y="215" text-anchor="middle" font-size="11" fill="#334155">locales y productos</text>
  </g>

  <g id="cu-02">
    <ellipse cx="310" cy="300" rx="108" ry="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
    <text x="310" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">CU-02: Iniciar sesión en el sistema</text>
  </g>

  <g id="cu-05">
    <ellipse cx="310" cy="420" rx="108" ry="26" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
    <text x="310" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">CU-05: Generar cupón de descuento QR</text>
  </g>

  <g id="cu-06">
    <ellipse cx="310" cy="520" rx="108" ry="26" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
    <text x="310" y="524" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">CU-06: Gestionar billetera de cupones</text>
  </g>

  <!-- ================= COLUMNA 2: EXTENSIONES E INCLUSIONES (cx=605) ================= -->
  <g id="cu-08">
    <ellipse cx="605" cy="115" rx="112" ry="27" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#shadow)" />
    <text x="605" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">CU-08: Parametrizar franja</text>
    <text x="605" y="125" text-anchor="middle" font-size="11" fill="#78350f">horaria relámpago</text>
  </g>

  <g id="cu-04">
    <ellipse cx="605" cy="205" rx="112" ry="27" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#shadow)" />
    <text x="605" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">CU-04: Filtrar opciones por</text>
    <text x="605" y="215" text-anchor="middle" font-size="11" fill="#78350f">presupuesto monetario</text>
  </g>

  <g id="cu-11">
    <ellipse cx="605" cy="630" rx="115" ry="29" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#shadow)" />
    <text x="605" y="626" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">CU-11: Validar pertenencia de local</text>
    <text x="605" y="640" text-anchor="middle" font-size="11" fill="#1e3a8a">y vigencia horaria</text>
  </g>

  <!-- ================= COLUMNA 3: LOCATARIO, MALL Y CAJA (cx=895) ================= -->
  <g id="cu-07">
    <ellipse cx="895" cy="115" rx="112" ry="27" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
    <text x="895" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">CU-07: Registrar promoción</text>
    <text x="895" y="125" text-anchor="middle" font-size="11" fill="#1e3a8a">comercial con cupos</text>
  </g>

  <g id="cu-09">
    <ellipse cx="895" cy="245" rx="112" ry="27" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
    <text x="895" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">CU-09: Gestionar perfil de</text>
    <text x="895" y="255" text-anchor="middle" font-size="11" fill="#334155">local comercial</text>
  </g>

  <g id="cu-12">
    <ellipse cx="895" cy="380" rx="115" ry="29" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" filter="url(#shadow)" />
    <text x="895" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b21a8">CU-12: Consultar analítica de</text>
    <text x="895" y="390" text-anchor="middle" font-size="11" fill="#581c87">conversión y auditoría</text>
  </g>

  <g id="cu-10">
    <ellipse cx="895" cy="630" rx="112" ry="29" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2" filter="url(#shadow)" />
    <text x="895" y="626" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">CU-10: Redimir cupón de</text>
    <text x="895" y="640" text-anchor="middle" font-size="11" fill="#7f1d1d">descuento en caja</text>
  </g>

  <!-- ================= ACTORES (FUERA DE LA FRONTERA) ================= -->
  <g id="actor-visitante" transform="translate(85, 290)">
    <circle cx="0" cy="-35" r="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2" />
    <line x1="0" y1="-18" x2="0" y2="30" stroke="#0284c7" stroke-width="2.2" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#0284c7" stroke-width="2.2" />
    <line x1="0" y1="30" x2="-20" y2="70" stroke="#0284c7" stroke-width="2.2" />
    <line x1="0" y1="30" x2="20" y2="70" stroke="#0284c7" stroke-width="2.2" />
    <rect x="-65" y="80" width="130" height="38" rx="6" fill="#0f172a" />
    <text x="0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Visitante</text>
    <text x="0" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">(Consumidor)</text>
  </g>

  <g id="actor-locatario" transform="translate(1155, 210)">
    <circle cx="0" cy="-35" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2" />
    <line x1="0" y1="-18" x2="0" y2="30" stroke="#2563eb" stroke-width="2.2" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#2563eb" stroke-width="2.2" />
    <line x1="0" y1="30" x2="-20" y2="70" stroke="#2563eb" stroke-width="2.2" />
    <line x1="0" y1="30" x2="20" y2="70" stroke="#2563eb" stroke-width="2.2" />
    <rect x="-65" y="80" width="130" height="38" rx="6" fill="#0f172a" />
    <text x="0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Locatario</text>
    <text x="0" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">(Admin Tienda)</text>
  </g>

  <g id="actor-admin" transform="translate(1155, 425)">
    <circle cx="0" cy="-35" r="17" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.2" />
    <line x1="0" y1="-18" x2="0" y2="30" stroke="#9333ea" stroke-width="2.2" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#9333ea" stroke-width="2.2" />
    <line x1="0" y1="30" x2="-20" y2="70" stroke="#9333ea" stroke-width="2.2" />
    <line x1="0" y1="30" x2="20" y2="70" stroke="#9333ea" stroke-width="2.2" />
    <rect x="-70" y="80" width="140" height="38" rx="6" fill="#0f172a" />
    <text x="0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Superadministrador</text>
    <text x="0" y="110" text-anchor="middle" font-size="10" fill="#d8b4fe">(Gestor Mall)</text>
  </g>

  <g id="actor-cajero" transform="translate(1155, 630)">
    <circle cx="0" cy="-35" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2" />
    <line x1="0" y1="-18" x2="0" y2="30" stroke="#dc2626" stroke-width="2.2" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#dc2626" stroke-width="2.2" />
    <line x1="0" y1="30" x2="-20" y2="70" stroke="#dc2626" stroke-width="2.2" />
    <line x1="0" y1="30" x2="20" y2="70" stroke="#dc2626" stroke-width="2.2" />
    <rect x="-65" y="80" width="130" height="38" rx="6" fill="#0f172a" />
    <text x="0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Cajero</text>
    <text x="0" y="110" text-anchor="middle" font-size="10" fill="#fca5a5">(Validador Caja)</text>
  </g>

  <!-- ================= ASOCIACIONES DIRECTAS (CERO CRUCES) ================= -->
  <!-- Visitante -> Columna 1 -->
  <line x1="115" y1="265" x2="208" y2="122" stroke="#475569" stroke-width="1.6" />
  <line x1="120" y1="278" x2="204" y2="208" stroke="#475569" stroke-width="1.6" />
  <line x1="120" y1="290" x2="202" y2="300" stroke="#475569" stroke-width="1.6" />
  <line x1="120" y1="302" x2="204" y2="416" stroke="#475569" stroke-width="1.6" />
  <line x1="115" y1="315" x2="208" y2="515" stroke="#475569" stroke-width="1.6" />

  <!-- Locatario -> CU-07, CU-09, CU-12 -->
  <line x1="1120" y1="195" x2="1003" y2="122" stroke="#475569" stroke-width="1.6" />
  <line x1="1120" y1="212" x2="1007" y2="245" stroke="#475569" stroke-width="1.6" />
  <line x1="1120" y1="228" x2="1005" y2="370" stroke="#475569" stroke-width="1.6" />

  <!-- Superadministrador -> CU-12 -->
  <line x1="1120" y1="420" x2="1008" y2="386" stroke="#475569" stroke-width="1.6" />

  <!-- Cajero -> CU-10 -->
  <line x1="1120" y1="630" x2="1007" y2="630" stroke="#dc2626" stroke-width="2" />

  <!-- ================= RELACIONES INCLUDE Y EXTEND LIMPIAS ================= -->
  <!-- CU-05 -> CU-02 <<include>> (Vertical arriba en Col 1) -->
  <path d="M 310 394 L 310 332" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-include)" />
  <rect x="272" y="352" width="76" height="20" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="310" y="366" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">«include»</text>

  <!-- CU-04 -> CU-03 <<extend>> (Horizontal izquierda entre Col 2 y Col 1) -->
  <path d="M 493 205 L 424 205" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-extend)" />
  <rect x="425" y="176" width="66" height="19" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
  <text x="458" y="189" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">«extend»</text>

  <!-- CU-08 -> CU-07 <<extend>> (Horizontal derecha entre Col 2 y Col 3) -->
  <path d="M 717 115 L 777 115" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-extend)" />
  <rect x="717" y="86" width="66" height="19" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
  <text x="750" y="99" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">«extend»</text>

  <!-- CU-10 -> CU-11 <<include>> (Horizontal izquierda entre Col 3 y Col 2) -->
  <path d="M 783 630 L 726 630" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-include)" />
  <rect x="718" y="600" width="68" height="19" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="752" y="613" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">«include»</text>

  <!-- ================= LEYENDA INFERIOR IZQUIERDA ================= -->
  <g transform="translate(205, 610)">
    <rect width="235" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="15" y="22" font-size="11.5" font-weight="bold" fill="#0f172a">Convenciones UML 2.5</text>
    <line x1="15" y1="44" x2="50" y2="44" stroke="#475569" stroke-width="1.8" />
    <text x="60" y="48" font-size="10.5" fill="#334155">Asociación actor - caso de uso</text>
    <line x1="15" y1="70" x2="50" y2="70" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-include)" />
    <text x="60" y="74" font-size="10.5" font-weight="600" fill="#1e40af">«include» (Obligatorio)</text>
    <line x1="15" y1="96" x2="50" y2="96" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-extend)" />
    <text x="60" y="100" font-size="10.5" font-weight="600" fill="#92400e">«extend» (Opcional / Condicional)</text>
    <circle cx="32" cy="117" r="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
    <text x="60" y="121" font-size="10.5" fill="#991b1b">Operación crítica en punto de venta</text>
  </g>
</svg>