<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arrow-include" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#2563eb" stroke-width="1.8" />
    </marker>
    <marker id="arrow-extend" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#d97706" stroke-width="1.8" />
    </marker>

    <!-- Drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1300" height="880" fill="#f8fafc" />

  <!-- ================= FRONTERA DEL SISTEMA ================= -->
  <rect x="180" y="30" width="810" height="780" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 4" filter="url(#shadow)" />
  
  <!-- Boundary Header Tag -->
  <rect x="180" y="30" width="480" height="34" rx="6" fill="#0284c7" />
  <text x="195" y="53" font-size="13" font-weight="bold" fill="#ffffff">Sistema Nuvora — Centro Comercial San Pedro Plaza</text>

  <!-- Subsystem Headers -->
  <text x="210" y="80" font-size="11" font-weight="bold" fill="#0369a1" letter-spacing="0.5">MÓDULO VISITANTE &amp; CONSUMIDOR</text>
  <text x="715" y="80" font-size="11" font-weight="bold" fill="#0369a1" letter-spacing="0.5">MÓDULO LOCATARIO, CAJERO &amp; MALL</text>

  <!-- ================= COLUMNA 1: ACCESO Y CUPONES (VISITANTE) ================= -->

  <!-- CU-01: Registrar usuario visitante -->
  <g id="cu-01">
    <ellipse cx="320" cy="115" rx="110" ry="26" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
    <text x="320" y="119" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">CU-01: Registrar usuario visitante</text>
  </g>

  <!-- CU-02: Iniciar sesión en el sistema -->
  <g id="cu-02">
    <ellipse cx="320" cy="205" rx="110" ry="26" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
    <text x="320" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">CU-02: Iniciar sesión en el sistema</text>
  </g>

  <!-- CU-05: Generar cupón de descuento QR -->
  <g id="cu-05">
    <ellipse cx="320" cy="340" rx="110" ry="26" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
    <text x="320" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">CU-05: Generar cupón de descuento QR</text>
  </g>

  <!-- CU-06: Gestionar billetera de cupones -->
  <g id="cu-06">
    <ellipse cx="320" cy="460" rx="110" ry="26" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
    <text x="320" y="464" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">CU-06: Gestionar billetera de cupones</text>
  </g>

  <!-- ================= COLUMNA 2: CATÁLOGO Y VALIDACIÓN ================= -->

  <!-- CU-03: Consultar catálogo de locales y productos -->
  <g id="cu-03">
    <ellipse cx="585" cy="140" rx="115" ry="27" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
    <text x="585" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">CU-03: Consultar catálogo de</text>
    <text x="585" y="150" text-anchor="middle" font-size="11" fill="#334155">locales y productos</text>
  </g>

  <!-- CU-04: Filtrar opciones por presupuesto -->
  <g id="cu-04">
    <ellipse cx="585" cy="265" rx="115" ry="27" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#shadow)" />
    <text x="585" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">CU-04: Filtrar opciones por</text>
    <text x="585" y="275" text-anchor="middle" font-size="11" fill="#78350f">presupuesto monetario</text>
  </g>

  <!-- CU-11: Validar pertenencia de local y vigencia horaria -->
  <g id="cu-11">
    <ellipse cx="580" cy="555" rx="118" ry="29" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#shadow)" />
    <text x="580" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">CU-11: Validar pertenencia de local</text>
    <text x="580" y="565" text-anchor="middle" font-size="11" fill="#1e3a8a">y vigencia horaria</text>
  </g>

  <!-- ================= COLUMNA 3: PROMOCIONES Y CAJA ================= -->

  <!-- CU-07: Registrar promoción comercial con cupos -->
  <g id="cu-07">
    <ellipse cx="845" cy="140" rx="115" ry="27" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
    <text x="845" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">CU-07: Registrar promoción</text>
    <text x="845" y="150" text-anchor="middle" font-size="11" fill="#1e3a8a">comercial con cupos</text>
  </g>

  <!-- CU-08: Parametrizar franja horaria relámpago -->
  <g id="cu-08">
    <ellipse cx="845" cy="265" rx="115" ry="27" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#shadow)" />
    <text x="845" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">CU-08: Parametrizar franja</text>
    <text x="845" y="275" text-anchor="middle" font-size="11" fill="#78350f">horaria relámpago</text>
  </g>

  <!-- CU-09: Gestionar perfil de local comercial -->
  <g id="cu-09">
    <ellipse cx="845" cy="385" rx="115" ry="27" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
    <text x="845" y="381" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">CU-09: Gestionar perfil de</text>
    <text x="845" y="395" text-anchor="middle" font-size="11" fill="#334155">local comercial</text>
  </g>

  <!-- CU-10: Redimir cupón de descuento en caja -->
  <g id="cu-10">
    <ellipse cx="845" cy="555" rx="115" ry="29" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2" filter="url(#shadow)" />
    <text x="845" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">CU-10: Redimir cupón de</text>
    <text x="845" y="565" text-anchor="middle" font-size="11" fill="#7f1d1d">descuento en caja</text>
  </g>

  <!-- ================= CENTRO INFERIOR: ANALÍTICA ================= -->
  <g id="cu-12">
    <ellipse cx="585" cy="710" rx="140" ry="29" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" filter="url(#shadow)" />
    <text x="585" y="706" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b21a8">CU-12: Consultar analítica de</text>
    <text x="585" y="720" text-anchor="middle" font-size="11" fill="#581c87">conversión y auditoría</text>
  </g>


  <!-- ================= ACTORES ================= -->

  <!-- ACTOR 1: Visitante (Izquierda) -->
  <g id="actor-visitante" transform="translate(85, 275)">
    <circle cx="0" cy="-35" r="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2" />
    <line x1="0" y1="-18" x2="0" y2="30" stroke="#0284c7" stroke-width="2.2" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#0284c7" stroke-width="2.2" />
    <line x1="0" y1="30" x2="-20" y2="70" stroke="#0284c7" stroke-width="2.2" />
    <line x1="0" y1="30" x2="20" y2="70" stroke="#0284c7" stroke-width="2.2" />
    <rect x="-65" y="80" width="130" height="38" rx="6" fill="#0f172a" />
    <text x="0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Visitante</text>
    <text x="0" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">(Consumidor)</text>
  </g>

  <!-- ACTOR 2: Locatario (Derecha Superior) -->
  <g id="actor-locatario" transform="translate(1085, 215)">
    <circle cx="0" cy="-35" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2" />
    <line x1="0" y1="-18" x2="0" y2="30" stroke="#2563eb" stroke-width="2.2" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#2563eb" stroke-width="2.2" />
    <line x1="0" y1="30" x2="-20" y2="70" stroke="#2563eb" stroke-width="2.2" />
    <line x1="0" y1="30" x2="20" y2="70" stroke="#2563eb" stroke-width="2.2" />
    <rect x="-65" y="80" width="130" height="38" rx="6" fill="#0f172a" />
    <text x="0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Locatario</text>
    <text x="0" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">(Admin Tienda)</text>
  </g>

  <!-- ACTOR 3: Cajero (Derecha Centro-Inferior) -->
  <g id="actor-cajero" transform="translate(1085, 525)">
    <circle cx="0" cy="-35" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2" />
    <line x1="0" y1="-18" x2="0" y2="30" stroke="#dc2626" stroke-width="2.2" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#dc2626" stroke-width="2.2" />
    <line x1="0" y1="30" x2="-20" y2="70" stroke="#dc2626" stroke-width="2.2" />
    <line x1="0" y1="30" x2="20" y2="70" stroke="#dc2626" stroke-width="2.2" />
    <rect x="-65" y="80" width="130" height="38" rx="6" fill="#0f172a" />
    <text x="0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Cajero</text>
    <text x="0" y="110" text-anchor="middle" font-size="10" fill="#fca5a5">(Validador Caja)</text>
  </g>

  <!-- ACTOR 4: Superadministrador (Derecha Inferior) -->
  <g id="actor-admin" transform="translate(1085, 695)">
    <circle cx="0" cy="-35" r="17" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.2" />
    <line x1="0" y1="-18" x2="0" y2="30" stroke="#9333ea" stroke-width="2.2" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#9333ea" stroke-width="2.2" />
    <line x1="0" y1="30" x2="-20" y2="70" stroke="#9333ea" stroke-width="2.2" />
    <line x1="0" y1="30" x2="20" y2="70" stroke="#9333ea" stroke-width="2.2" />
    <rect x="-70" y="80" width="140" height="38" rx="6" fill="#0f172a" />
    <text x="0" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Superadministrador</text>
    <text x="0" y="110" text-anchor="middle" font-size="10" fill="#d8b4fe">(Gestor Mall)</text>
  </g>


  <!-- ================= ASOCIACIONES (LÍNEAS SÓLIDAS LIMPIAS) ================= -->

  <!-- Visitante -> CU-01, CU-02, CU-03, CU-05, CU-06 -->
  <line x1="115" y1="265" x2="215" y2="125" stroke="#475569" stroke-width="1.6" />
  <line x1="120" y1="275" x2="210" y2="205" stroke="#475569" stroke-width="1.6" />
  <line x1="120" y1="285" x2="475" y2="150" stroke="#475569" stroke-width="1.6" />
  <line x1="120" y1="295" x2="210" y2="340" stroke="#475569" stroke-width="1.6" />
  <line x1="115" y1="305" x2="215" y2="450" stroke="#475569" stroke-width="1.6" />

  <!-- Locatario -> CU-07, CU-09, CU-12 -->
  <line x1="1050" y1="225" x2="960" y2="150" stroke="#475569" stroke-width="1.6" />
  <line x1="1050" y1="235" x2="960" y2="385" stroke="#475569" stroke-width="1.6" />
  <line x1="1050" y1="250" x2="725" y2="700" stroke="#475569" stroke-width="1.6" />

  <!-- Cajero -> CU-10 -->
  <line x1="1050" y1="555" x2="960" y2="555" stroke="#dc2626" stroke-width="2" />

  <!-- Superadministrador -> CU-12 -->
  <line x1="1050" y1="715" x2="725" y2="715" stroke="#475569" stroke-width="1.6" />


  <!-- ================= RELACIONES INCLUDE Y EXTEND LIMPIAS (SIN CRUCES) ================= -->

  <!-- 1. CU-05 (Generar cupón) INCLUYE CU-02 (Iniciar sesión) - Directo y vertical hacia arriba en Columna 1 -->
  <path d="M 320 314 L 320 237" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-include)" />
  <rect x="278" y="265" width="84" height="20" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="320" y="279" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">«include»</text>

  <!-- 2. CU-04 (Filtrar presupuesto) EXTIENDE CU-03 (Consultar catálogo) - Directo y vertical hacia arriba en Columna 2 -->
  <path d="M 585 238 L 585 173" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-extend)" />
  <rect x="543" y="195" width="84" height="20" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
  <text x="585" y="209" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">«extend»</text>

  <!-- 3. CU-08 (Franja relámpago) EXTIENDE CU-07 (Registrar promo) - Directo y vertical hacia arriba en Columna 3 -->
  <path d="M 845 238 L 845 173" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-extend)" />
  <rect x="803" y="195" width="84" height="20" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
  <text x="845" y="209" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">«extend»</text>

  <!-- 4. CU-10 (Redimir cupón) INCLUYE CU-11 (Validar pertenencia y vigencia) - Directo y horizontal hacia la izquierda -->
  <path d="M 730 555 L 704 555" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-include)" />
  <rect x="675" y="525" width="84" height="20" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
  <text x="717" y="539" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">«include»</text>

</svg>