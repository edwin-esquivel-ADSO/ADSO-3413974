<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="inherit" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon points="0,1 10,6 0,11" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    </marker>
    <marker id="diamond-filled" viewBox="0 0 14 10" refX="0" refY="5" markerWidth="12" markerHeight="9" orient="auto">
      <polygon points="0,5 7,1 14,5 7,9" fill="#0f172a" stroke="#0f172a" stroke-width="1" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="840" fill="#f8fafc" />

  <!-- Banner Título -->
  <rect x="25" y="20" width="1150" height="45" rx="8" fill="#0f172a" />
  <text x="45" y="48" font-size="14" font-weight="bold" fill="#ffffff">Modelo de Dominio Conceptual · Nuvora (12 Clases del Negocio — Sin Métodos ni Claves Técnicas)</text>

  <!-- ================= CLASE PADRE: USUARIO (Generalización) ================= -->
  <g transform="translate(220, 95)" filter="url(#shadow)">
    <rect width="210" height="85" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect width="210" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text x="105" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Usuario</text>
    <text x="12" y="47" font-size="11" fill="#334155">- nombreCompleto</text>
    <text x="12" y="63" font-size="11" fill="#334155">- correoElectronico</text>
    <text x="12" y="79" font-size="11" fill="#334155">- estadoCuenta</text>
  </g>

  <!-- Subclases de Usuario -->
  <!-- Visitante -->
  <g transform="translate(45, 240)" filter="url(#shadow)">
    <rect width="170" height="72" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <rect width="170" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="85" y="18" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">Visitante</text>
    <text x="10" y="44" font-size="10.5" fill="#334155">- fechaRegistro</text>
    <text x="10" y="60" font-size="10.5" fill="#334155">- autorizaTratamientoDatos</text>
  </g>

  <!-- Locatario -->
  <g transform="translate(240, 240)" filter="url(#shadow)">
    <rect width="170" height="72" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect width="170" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="85" y="18" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">Locatario</text>
    <text x="10" y="44" font-size="10.5" fill="#334155">- cargoEnLocal</text>
    <text x="10" y="60" font-size="10.5" fill="#334155">- telefonoContacto</text>
  </g>

  <!-- Cajero -->
  <g transform="translate(435, 240)" filter="url(#shadow)">
    <rect width="170" height="72" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <rect width="170" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="85" y="18" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">Cajero</text>
    <text x="10" y="44" font-size="10.5" fill="#334155">- turnoOperacion</text>
    <text x="10" y="60" font-size="10.5" fill="#334155">- cajaAsignada</text>
  </g>

  <!-- ================= CENTRO COMERCIAL: LOCAL, CATEGORÍA Y PRODUCTO ================= -->
  <!-- LocalComercial -->
  <g transform="translate(690, 95)" filter="url(#shadow)">
    <rect width="205" height="98" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <rect width="205" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
    <text x="102" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">LocalComercial</text>
    <text x="12" y="47" font-size="11" fill="#334155">- nombreComercial</text>
    <text x="12" y="63" font-size="11" fill="#334155">- numeroLocal</text>
    <text x="12" y="79" font-size="11" fill="#334155">- horarioAtencion</text>
    <text x="12" y="93" font-size="11" fill="#334155">- estadoOperativo</text>
  </g>

  <!-- Categoria -->
  <g transform="translate(970, 95)" filter="url(#shadow)">
    <rect width="185" height="75" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <rect width="185" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
    <text x="92" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Categoria</text>
    <text x="12" y="48" font-size="11" fill="#334155">- nombreCategoria</text>
    <text x="12" y="64" font-size="11" fill="#334155">- iconoRepresentativo</text>
  </g>

  <!-- Producto -->
  <g transform="translate(965, 240)" filter="url(#shadow)">
    <rect width="190" height="88" rx="6" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <rect width="190" height="26" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2" />
    <text x="95" y="18" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Producto</text>
    <text x="12" y="44" font-size="11" fill="#334155">- nombreProducto</text>
    <text x="12" y="60" font-size="11" fill="#334155">- descripcion</text>
    <text x="12" y="76" font-size="11" fill="#334155">- precioRegular</text>
  </g>

  <!-- ================= PROMOCIÓN Y FRANJA HORARIA ================= -->
  <!-- Promocion -->
  <g transform="translate(690, 395)" filter="url(#shadow)">
    <rect width="215" height="122" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <rect width="215" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="107" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Promocion</text>
    <text x="12" y="46" font-size="11" fill="#334155">- tituloOferta</text>
    <text x="12" y="62" font-size="11" fill="#334155">- precioPromocional</text>
    <text x="12" y="78" font-size="11" fill="#334155">- cupoMaximo</text>
    <text x="12" y="94" font-size="11" fill="#334155">- fechaInicio / fechaFin</text>
    <text x="12" y="110" font-size="11" fill="#334155">- estadoPromocion</text>
  </g>

  <!-- FranjaHoraria -->
  <g transform="translate(970, 415)" filter="url(#shadow)">
    <rect width="185" height="88" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <rect width="185" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text x="92" y="18" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">FranjaHoraria</text>
    <text x="12" y="44" font-size="11" fill="#334155">- diaSemana</text>
    <text x="12" y="60" font-size="11" fill="#334155">- horaInicio</text>
    <text x="12" y="76" font-size="11" fill="#334155">- horaFin</text>
  </g>

  <!-- ================= CUPÓN, REDENCIÓN Y AUDITORÍA ================= -->
  <!-- Cupon -->
  <g transform="translate(45, 425)" filter="url(#shadow)">
    <rect width="205" height="106" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <rect width="205" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="102" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Cupon</text>
    <text x="12" y="46" font-size="11" fill="#334155">- codigoAlfanumerico</text>
    <text x="12" y="62" font-size="11" fill="#334155">- fechaEmision</text>
    <text x="12" y="78" font-size="11" fill="#334155">- fechaExpiracion</text>
    <text x="12" y="94" font-size="11" fill="#334155">- estadoCupon</text>
  </g>

  <!-- Redencion -->
  <g transform="translate(390, 620)" filter="url(#shadow)">
    <rect width="205" height="85" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <rect width="205" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="102" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Redencion</text>
    <text x="12" y="47" font-size="11" fill="#334155">- fechaHoraCanje</text>
    <text x="12" y="63" font-size="11" fill="#334155">- montoDescontado</text>
    <text x="12" y="79" font-size="11" fill="#334155">- metodoValidacion</text>
  </g>

  <!-- RegistroAuditoria -->
  <g transform="translate(720, 620)" filter="url(#shadow)">
    <rect width="205" height="85" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="2" />
    <rect width="205" height="28" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
    <text x="102" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">RegistroAuditoria</text>
    <text x="12" y="47" font-size="11" fill="#334155">- accionRealizada</text>
    <text x="12" y="63" font-size="11" fill="#334155">- detalleOperacion</text>
    <text x="12" y="79" font-size="11" fill="#334155">- fechaHoraRegistro</text>
  </g>

  <!-- ================= RELACIONES Y MULTIPLICIDADES (CERO CRUCES) ================= -->

  <!-- Herencia Usuario <- Visitante, Locatario, Cajero -->
  <polyline points="130,240 130,210 325,210 325,185" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#inherit)" />
  <line x1="325" y1="240" x2="325" y2="210" stroke="#0f172a" stroke-width="1.6" />
  <polyline points="520,240 520,210 325,210" fill="none" stroke="#0f172a" stroke-width="1.6" />

  <!-- Locatario (administra) LocalComercial -->
  <polyline points="325,312 325,355 745,355 745,193" fill="none" stroke="#475569" stroke-width="1.6" />
  <text x="530" y="348" text-anchor="middle" font-size="10.5" fill="#475569">administra</text>
  <text x="340" y="328" font-size="10.5" font-weight="bold" fill="#0f172a">1..*</text>
  <text x="752" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>

  <!-- Cajero (atiende en) LocalComercial (desviado por x=575 para no tocar línea herencia) -->
  <polyline points="575,240 575,145 690,145" fill="none" stroke="#475569" stroke-width="1.6" />
  <text x="632" y="138" text-anchor="middle" font-size="10.5" fill="#475569">atiende en</text>
  <text x="583" y="225" font-size="10.5" font-weight="bold" fill="#0f172a">1..*</text>
  <text x="670" y="160" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>

  <!-- LocalComercial <-> Categoria -->
  <line x1="895" y1="132" x2="970" y2="132" stroke="#475569" stroke-width="1.6" />
  <text x="932" y="124" text-anchor="middle" font-size="10" fill="#475569">pertenece</text>
  <text x="903" y="148" font-size="10.5" font-weight="bold" fill="#0f172a">1..*</text>
  <text x="945" y="148" font-size="10.5" font-weight="bold" fill="#0f172a">1..*</text>

  <!-- LocalComercial (ofrece) Producto -->
  <polyline points="865,193 865,284 965,284" fill="none" stroke="#475569" stroke-width="1.6" />
  <text x="915" y="276" text-anchor="middle" font-size="10.5" fill="#475569">ofrece</text>
  <text x="873" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="940" y="298" font-size="10.5" font-weight="bold" fill="#0f172a">1..*</text>

  <!-- LocalComercial (publica) Promocion -->
  <line x1="795" y1="193" x2="795" y2="395" stroke="#475569" stroke-width="1.6" />
  <text x="802" y="310" font-size="10.5" fill="#475569">publica</text>
  <text x="782" y="210" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="774" y="385" font-size="10.5" font-weight="bold" fill="#0f172a">0..*</text>

  <!-- Producto (es ofertado en) Promocion -->
  <polyline points="1030,328 1030,370 865,370 865,395" fill="none" stroke="#475569" stroke-width="1.6" />
  <text x="955" y="362" text-anchor="middle" font-size="10" fill="#475569">incluido en</text>
  <text x="1038" y="344" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="873" y="390" font-size="10.5" font-weight="bold" fill="#0f172a">0..*</text>

  <!-- Promocion (compuesta por) FranjaHoraria -->
  <line x1="905" y1="458" x2="970" y2="458" stroke="#0f172a" stroke-width="1.6" marker-start="url(#diamond-filled)" />
  <text x="937" y="446" text-anchor="middle" font-size="10" fill="#475569">restringida</text>
  <text x="915" y="474" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="948" y="474" font-size="10.5" font-weight="bold" fill="#0f172a">0..*</text>

  <!-- Visitante (reclama) Cupon -->
  <line x1="130" y1="312" x2="130" y2="425" stroke="#475569" stroke-width="1.6" />
  <text x="138" y="372" font-size="10.5" fill="#475569">reclama</text>
  <text x="115" y="328" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="108" y="415" font-size="10.5" font-weight="bold" fill="#0f172a">0..*</text>

  <!-- Promocion (origina) Cupon -->
  <line x1="690" y1="478" x2="250" y2="478" stroke="#475569" stroke-width="1.6" />
  <text x="470" y="470" text-anchor="middle" font-size="10.5" fill="#475569">origina</text>
  <text x="675" y="494" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="260" y="494" font-size="10.5" font-weight="bold" fill="#0f172a">0..*</text>

  <!-- Cupon (culmina en) Redencion -->
  <polyline points="145,531 145,662 390,662" fill="none" stroke="#475569" stroke-width="1.6" />
  <text x="265" y="654" text-anchor="middle" font-size="10.5" fill="#475569">culmina en</text>
  <text x="155" y="548" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="362" y="678" font-size="10.5" font-weight="bold" fill="#0f172a">0..1</text>

  <!-- Cajero (ejecuta) Redencion -->
  <polyline points="492,312 492,620" fill="none" stroke="#475569" stroke-width="1.6" />
  <text x="500" y="535" font-size="10.5" fill="#475569">ejecuta</text>
  <text x="478" y="328" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="472" y="610" font-size="10.5" font-weight="bold" fill="#0f172a">0..*</text>

  <!-- Redencion (genera) RegistroAuditoria -->
  <line x1="595" y1="662" x2="720" y2="662" stroke="#475569" stroke-width="1.6" />
  <text x="657" y="654" text-anchor="middle" font-size="10.5" fill="#475569">audita</text>
  <text x="605" y="678" font-size="10.5" font-weight="bold" fill="#0f172a">1</text>
  <text x="695" y="678" font-size="10.5" font-weight="bold" fill="#0f172a">1..*</text>

  <!-- Nota -->
  <rect x="45" y="750" width="1110" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="65" y="775" font-size="11.5" font-weight="bold" fill="#0f172a">Convenciones de Modelo Conceptual (Dominio):</text>
  <text x="65" y="795" font-size="11" fill="#334155">• Generalización (triángulo blanco): Visitante, Locatario y Cajero heredan atributos de Usuario. • Composición (rombo relleno): FranjaHoraria depende de Promocion. • Sin métodos ni llaves técnicas.</text>
</svg>