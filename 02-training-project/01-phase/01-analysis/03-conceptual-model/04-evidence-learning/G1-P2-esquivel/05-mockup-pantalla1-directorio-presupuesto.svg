<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" width="100%" height="100%" style="background:#f1f5f9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Rótulo de Caso de Uso (Exigido por Rúbrica G1 C5) -->
  <rect x="10" y="10" width="400" height="44" rx="8" fill="#0f172a" />
  <text x="210" y="29" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#38bdf8">PANTALLA 1 · ATIENDE: CU-03 y CU-04</text>
  <text x="210" y="45" text-anchor="middle" font-size="10.5" fill="#e2e8f0">Directorio de Locales y Filtro por Presupuesto ($COP)</text>

  <!-- Marco del Celular -->
  <rect x="25" y="66" width="370" height="675" rx="28" fill="#ffffff" stroke="#334155" stroke-width="4" filter="url(#shadow)" />
  <rect x="155" y="76" width="110" height="12" rx="6" fill="#e2e8f0" />

  <!-- Encabezado App Nuvora -->
  <rect x="35" y="100" width="350" height="64" rx="10" fill="#0284c7" />
  <text x="52" y="127" font-size="18" font-weight="bold" fill="#ffffff">Nuvora</text>
  <text x="52" y="148" font-size="11" fill="#e0f2fe">C.C. San Pedro Plaza · Neiva</text>
  <rect x="275" y="114" width="95" height="28" rx="14" fill="#0369a1" />
  <text x="322" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Mis Cupones</text>

  <!-- Barra de búsqueda (CU-03 / RF08) -->
  <rect x="42" y="176" width="336" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="56" y="201" font-size="12" fill="#64748b">Buscar local o comida (ej. hamburguesa)...</text>

  <!-- Caja de Filtro Inteligente por Presupuesto (CU-04 / RF07) -->
  <rect x="42" y="228" width="336" height="106" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" />
  <text x="56" y="250" font-size="12.5" font-weight="bold" fill="#92400e">¿Qué puedo comer con mi presupuesto?</text>
  <text x="56" y="268" font-size="11" fill="#78350f">Ingresa cuánto dinero tienes disponible hoy:</text>
  <rect x="56" y="278" width="185" height="40" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
  <text x="70" y="303" font-size="14" font-weight="bold" fill="#0f172a">$ 18.000 COP</text>
  <rect x="252" y="278" width="112" height="40" rx="8" fill="#d97706" />
  <text x="308" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Filtrar</text>

  <!-- Chips de Categorías (RF05) -->
  <rect x="42" y="348" width="118" height="28" rx="14" fill="#0f172a" />
  <text x="101" y="366" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Comidas Rápidas</text>
  <rect x="168" y="348" width="110" height="28" rx="14" fill="#e2e8f0" />
  <text x="223" y="366" text-anchor="middle" font-size="10.5" fill="#334155">Postres &amp; Café</text>
  <rect x="286" y="348" width="92" height="28" rx="14" fill="#e2e8f0" />
  <text x="332" y="366" text-anchor="middle" font-size="10.5" fill="#334155">Calzado</text>

  <!-- Resultados ordenados de menor a mayor precio -->
  <text x="44" y="398" font-size="11.5" font-weight="bold" fill="#334155">Opciones disponibles hasta $18.000 (2):</text>

  <!-- Tarjeta 1 -->
  <rect x="42" y="410" width="336" height="122" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="54" y="422" width="76" height="76" rx="8" fill="#fef3c7" />
  <text x="92" y="464" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">Cholupa</text>
  <text x="142" y="436" font-size="12.5" font-weight="bold" fill="#0f172a">Delicias del Huila · Isla I-08</text>
  <text x="142" y="454" font-size="11" fill="#475569">Combo Onces: Cholupa + Achiras</text>
  <text x="142" y="476" font-size="11" text-decoration="line-through" fill="#94a3b8">$14.000</text>
  <text x="200" y="476" font-size="14" font-weight="bold" fill="#16a34a">$10.000 COP</text>
  <rect x="142" y="488" width="222" height="34" rx="8" fill="#16a34a" />
  <text x="253" y="509" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Obtener Cupón de Descuento</text>

  <!-- Tarjeta 2 -->
  <rect x="42" y="544" width="336" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="54" y="556" width="76" height="76" rx="8" fill="#fee2e2" />
  <text x="92" y="598" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">Combo</text>
  <text x="142" y="570" font-size="12.5" font-weight="bold" fill="#0f172a">El Corralito Parrilla · Local P-14</text>
  <text x="142" y="588" font-size="11" fill="#475569">Burger Clásica + Papas + Gaseosa</text>
  <rect x="142" y="596" width="135" height="18" rx="4" fill="#fef2f2" />
  <text x="209" y="608" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#dc2626">Oferta Relámpago · 12 cupos</text>
  <text x="142" y="632" font-size="11" text-decoration="line-through" fill="#94a3b8">$24.000</text>
  <text x="200" y="632" font-size="14" font-weight="bold" fill="#16a34a">$17.500 COP</text>
  <rect x="142" y="639" width="222" height="26" rx="6" fill="#16a34a" />
  <text x="253" y="656" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Obtener Cupón de Descuento</text>

  <!-- Barra de navegación inferior -->
  <rect x="35" y="684" width="350" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="105" y="711" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">Explorar</text>
  <text x="210" y="711" text-anchor="middle" font-size="11" fill="#64748b">Locales</text>
  <text x="315" y="711" text-anchor="middle" font-size="11" fill="#64748b">Mi Cuenta</text>
</svg>