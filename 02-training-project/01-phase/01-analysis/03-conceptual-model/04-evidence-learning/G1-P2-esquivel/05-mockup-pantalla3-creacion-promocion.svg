<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="100%" height="100%" style="background:#f1f5f9; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Rótulo de Caso de Uso -->
  <rect x="20" y="15" width="780" height="44" rx="8" fill="#0f172a" />
  <text x="410" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#60a5fa">PANTALLA 3 · ATIENDE: CU-07 y CU-08</text>
  <text x="410" y="50" text-anchor="middle" font-size="11" fill="#e2e8f0">Panel de Creación de Promoción Comercial y Franja Relámpago (Locatario)</text>

  <!-- Ventana de Escritorio / Tablet del Local -->
  <rect x="20" y="72" width="780" height="528" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />

  <!-- Barra lateral izquierda -->
  <rect x="20" y="72" width="185" height="528" rx="10" fill="#1e293b" />
  <text x="40" y="110" font-size="16" font-weight="bold" fill="#38bdf8">Nuvora Local</text>
  <text x="40" y="130" font-size="10.5" fill="#94a3b8">El Corralito · P-14</text>
  <rect x="30" y="160" width="165" height="36" rx="6" fill="#0284c7" />
  <text x="45" y="183" font-size="12" font-weight="bold" fill="#ffffff">Promociones</text>
  <text x="45" y="220" font-size="12" fill="#cbd5e1">Carta de Productos</text>
  <text x="45" y="255" font-size="12" fill="#cbd5e1">Métricas del Local</text>
  <text x="45" y="290" font-size="12" fill="#cbd5e1">Perfil de Tienda</text>

  <!-- Área de Formulario -->
  <text x="230" y="112" font-size="17" font-weight="bold" fill="#0f172a">Nueva Promoción Comercial</text>
  <text x="230" y="132" font-size="11.5" fill="#64748b">Configura descuentos con cupos limitados y horarios para horas valle.</text>

  <!-- Campo Producto y Título -->
  <text x="230" y="166" font-size="11.5" font-weight="bold" fill="#334155">1. Producto del menú:</text>
  <rect x="230" y="174" width="260" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <text x="242" y="196" font-size="11.5" fill="#0f172a">Burger Clásica + Papas ($24.000)</text>

  <text x="510" y="166" font-size="11.5" font-weight="bold" fill="#334155">2. Título de la promoción:</text>
  <rect x="510" y="174" width="265" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <text x="522" y="196" font-size="11.5" fill="#0f172a">Hora Feliz Parrilla — 27% OFF</text>

  <!-- Precio Oferta y Cupos -->
  <text x="230" y="236" font-size="11.5" font-weight="bold" fill="#334155">3. Precio promocional ($COP):</text>
  <rect x="230" y="244" width="165" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <text x="242" y="266" font-size="12" font-weight="bold" fill="#16a34a">$ 17.500</text>

  <text x="415" y="236" font-size="11.5" font-weight="bold" fill="#334155">4. Cupo máximo (cupones):</text>
  <rect x="415" y="244" width="140" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <text x="427" y="266" font-size="12" font-weight="bold" fill="#0f172a">30 cupones</text>

  <text x="575" y="236" font-size="11.5" font-weight="bold" fill="#334155">5. Vigencia:</text>
  <rect x="575" y="244" width="200" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <text x="587" y="266" font-size="11" fill="#0f172a">26/Nov al 20/Dic 2026</text>

  <!-- Sección Extensión CU-08: Franja Horaria Relámpago -->
  <rect x="230" y="300" width="545" height="175" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
  <rect x="246" y="316" width="18" height="18" rx="4" fill="#d97706" />
  <text x="255" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">✓</text>
  <text x="274" y="330" font-size="12.5" font-weight="bold" fill="#92400e">Activar como Oferta Relámpago por Franja Horaria (CU-08)</text>

  <text x="248" y="360" font-size="11" font-weight="bold" fill="#78350f">Días de la semana activos:</text>
  <rect x="248" y="372" width="44" height="28" rx="6" fill="#ffffff" stroke="#d97706" />
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#78350f">Lun</text>
  <rect x="300" y="372" width="44" height="28" rx="6" fill="#d97706" />
  <text x="322" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Mar</text>
  <rect x="352" y="372" width="44" height="28" rx="6" fill="#d97706" />
  <text x="374" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Mié</text>
  <rect x="404" y="372" width="44" height="28" rx="6" fill="#d97706" />
  <text x="426" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Jue</text>
  <rect x="456" y="372" width="44" height="28" rx="6" fill="#ffffff" stroke="#d97706" />
  <text x="478" y="390" text-anchor="middle" font-size="10.5" fill="#78350f">Vie</text>

  <text x="248" y="424" font-size="11" font-weight="bold" fill="#78350f">Hora inicio:</text>
  <rect x="248" y="432" width="130" height="30" rx="6" fill="#ffffff" stroke="#d97706" />
  <text x="313" y="451" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">02:30 p. m.</text>

  <text x="405" y="424" font-size="11" font-weight="bold" fill="#78350f">Hora fin:</text>
  <rect x="405" y="432" width="130" height="30" rx="6" fill="#ffffff" stroke="#d97706" />
  <text x="470" y="451" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">05:30 p. m.</text>

  <!-- Botones de Acción (Borrador vs Publicar) -->
  <rect x="370" y="510" width="190" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
  <text x="465" y="537" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Guardar como Borrador</text>

  <rect x="575" y="510" width="200" height="44" rx="8" fill="#16a34a" />
  <text x="675" y="537" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Publicar Promoción Ahora</text>
</svg>