<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1120" height="840" fill="#f8fafc" />

  <!-- Título -->
  <rect x="25" y="20" width="1070" height="45" rx="8" fill="#0f172a" />
  <text x="45" y="48" font-size="14" font-weight="bold" fill="#ffffff">Diagrama de Actividades · CU-10: Redimir cupón de descuento en caja (con bifurcación paralela)</text>

  <!-- Carriles -->
  <rect x="25" y="75" width="230" height="740" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="25" y="75" width="230" height="36" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5" />
  <text x="140" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">Visitante</text>

  <rect x="255" y="75" width="350" height="740" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="255" y="75" width="350" height="36" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5" />
  <text x="430" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">Cajero (Mostrador)</text>

  <rect x="605" y="75" width="490" height="740" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="605" y="75" width="490" height="36" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5" />
  <text x="850" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0369a1">Sistema Nuvora</text>

  <!-- VISITANTE -->
  <circle cx="140" cy="140" r="11" fill="#0f172a" />
  <rect x="45" y="175" width="190" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
  <text x="140" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Presentar código QR del</text>
  <text x="140" y="214" text-anchor="middle" font-size="11" fill="#14532d">cupón en el celular</text>

  <rect x="45" y="690" width="190" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
  <text x="140" y="718" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Recibir pedido con descuento</text>

  <!-- CAJERO -->
  <polygon points="430,170 475,201 430,232 385,201" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
  <text x="430" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">¿Cámara</text>
  <text x="430" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">lee el QR?</text>

  <rect x="270" y="265" width="150" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)" />
  <text x="345" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Escanear QR con cámara</text>

  <rect x="440" y="265" width="150" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
  <text x="515" y="285" text-anchor="middle" font-size="10.5" font-weight="600" fill="#92400e">Digitar código</text>
  <text x="515" y="300" text-anchor="middle" font-size="10.5" fill="#78350f">manualmente</text>

  <polygon points="430,335 450,352 430,369 410,352" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />

  <rect x="330" y="455" width="200" height="48" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)" />
  <text x="430" y="476" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Informar al visitante que</text>
  <text x="430" y="492" text-anchor="middle" font-size="10.5" fill="#7f1d1d">el cupón fue rechazado</text>

  <rect x="330" y="690" width="200" height="48" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
  <text x="430" y="711" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Aplicar descuento, cobrar</text>
  <text x="430" y="727" text-anchor="middle" font-size="10.5" fill="#14532d">en caja y entregar pedido</text>

  <!-- SISTEMA NUVORA -->
  <rect x="705" y="175" width="290" height="58" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
  <text x="850" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Bloquear cupón y validar reglas (CU-11)</text>
  <text x="850" y="213" text-anchor="middle" font-size="10" fill="#334155">(existencia, local correcto, estado Emitido y horario)</text>

  <polygon points="850,260 895,295 850,330 805,295" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
  <text x="850" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">¿Cupón</text>
  <text x="850" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">válido?</text>

  <rect x="630" y="365" width="200" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)" />
  <text x="730" y="387" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Liberar bloqueo y mostrar</text>
  <text x="730" y="403" text-anchor="middle" font-size="10.5" fill="#7f1d1d">aviso rojo con motivo exacto</text>

  <!-- BIFURCACIÓN PARALELA (Barra negra explicada) -->
  <rect x="690" y="445" width="320" height="7" rx="3" fill="#0f172a" />
  <text x="850" y="438" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Bifurcación paralela (ejecuta ambas tareas a la vez)</text>

  <rect x="635" y="485" width="200" height="54" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
  <text x="735" y="507" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Marcar cupón como</text>
  <text x="735" y="523" text-anchor="middle" font-size="10.5" fill="#14532d">REDIMIDO y crear redención</text>

  <rect x="865" y="485" width="205" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
  <text x="967" y="507" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Guardar registro inmutable</text>
  <text x="967" y="523" text-anchor="middle" font-size="10.5" fill="#1e3a8a">en bitácora de auditoría</text>

  <!-- UNIÓN PARALELA (Barra negra explicada) -->
  <rect x="690" y="570" width="320" height="7" rx="3" fill="#0f172a" />
  <text x="850" y="564" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Unión paralela (espera a que ambas terminen)</text>

  <rect x="720" y="605" width="260" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
  <text x="850" y="627" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Desplegar pantalla verde de</text>
  <text x="850" y="643" text-anchor="middle" font-size="10.5" fill="#14532d">aprobado con combo y descuento</text>

  <!-- Leyenda de barras negras -->
  <rect x="635" y="695" width="435" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="650" y="715" font-size="11" font-weight="bold" fill="#0f172a">Nota sobre simbología UML:</text>
  <rect x="650" y="727" width="45" height="6" rx="2" fill="#0f172a" />
  <text x="705" y="734" font-size="10" fill="#334155">Barra negra gruesa = Tareas simultáneas (en paralelo).</text>
  <text x="650" y="754" font-size="10" fill="#334155">• Al aprobar el cupón, el sistema actualiza el estado y guarda</text>
  <text x="658" y="769" font-size="10" fill="#334155">la auditoría al mismo tiempo antes de mostrar aviso verde.</text>

  <!-- Nodo Final -->
  <circle cx="140" cy="785" r="13" fill="none" stroke="#0f172a" stroke-width="2" />
  <circle cx="140" cy="785" r="8" fill="#0f172a" />

  <!-- CONECTORES -->
  <line x1="140" y1="151" x2="140" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="235" y1="201" x2="380" y2="201" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <polyline points="385,201 345,201 345,260" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="315" y="220" width="60" height="16" fill="#ffffff" />
  <text x="345" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">[QR legible]</text>

  <polyline points="475,201 515,201 515,260" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="480" y="220" width="74" height="16" fill="#ffffff" />
  <text x="517" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">[Falla cámara]</text>

  <polyline points="345,311 345,352 405,352" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <polyline points="515,311 515,352 455,352" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <polyline points="430,369 430,395 570,395 570,150 850,150 850,170" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <line x1="850" y1="233" x2="850" y2="255" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <polyline points="805,295 730,295 730,360" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="690" y="315" width="76" height="16" fill="#ffffff" />
  <text x="728" y="327" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">[No válido]</text>

  <polyline points="630,392 535,392 535,450" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)" />
  <polyline points="330,479 285,479 285,785 158,785" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <polyline points="895,295 960,295 960,440" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="915" y="355" width="84" height="16" fill="#ffffff" />
  <text x="957" y="367" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">[Válido y vigente]</text>

  <line x1="735" y1="452" x2="735" y2="480" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="967" y1="452" x2="967" y2="480" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="735" y1="539" x2="735" y2="565" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="967" y1="539" x2="967" y2="565" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="850" y1="577" x2="850" y2="600" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <polyline points="720,631 580,631 580,714 535,714" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="330" y1="714" x2="240" y2="714" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="140" y1="736" x2="140" y2="767" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
</svg>