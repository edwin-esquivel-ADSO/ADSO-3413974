<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="980" height="780" fill="#f8fafc" />

  <!-- Título -->
  <rect x="30" y="20" width="920" height="45" rx="8" fill="#0f172a" />
  <text x="50" y="48" font-size="14" font-weight="bold" fill="#ffffff">Diagrama de Actividades · CU-07: Registrar promoción comercial con cupos</text>

  <!-- Swimlanes -->
  <!-- Carril 1: Locatario -->
  <rect x="30" y="75" width="450" height="680" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="30" y="75" width="450" height="36" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5" />
  <text x="255" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Locatario (Administrador de Local)</text>

  <!-- Carril 2: Sistema Nuvora -->
  <rect x="480" y="75" width="470" height="680" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="480" y="75" width="470" height="36" fill="#e0f2fe" stroke="#94a3b8" stroke-width="1.5" />
  <text x="715" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Sistema Nuvora</text>

  <!-- ================= CARRILL LOCATARIO ================= -->
  <!-- Nodo Inicial -->
  <circle cx="255" cy="140" r="11" fill="#0f172a" />

  <!-- Actividad 1 -->
  <rect x="125" y="175" width="260" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
  <text x="255" y="198" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Seleccionar producto e ingresar datos</text>
  <text x="255" y="214" text-anchor="middle" font-size="10.5" fill="#334155">(título, descuento, fechas y cupo máximo)</text>

  <!-- Decisión 1: ¿Oferta relámpago? -->
  <polygon points="255,255 295,285 255,315 215,285" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
  <text x="255" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">¿Oferta</text>
  <text x="255" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">relámpago?</text>

  <!-- Actividad 2 (Rama Sí) -->
  <rect x="55" y="345" width="205" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
  <text x="157" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Parametrizar días y</text>
  <text x="157" y="384" text-anchor="middle" font-size="11" fill="#78350f">franja horaria (CU-08)</text>

  <!-- Unión de flujo (Merge) -->
  <polygon points="255,425 275,442 255,459 235,442" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />

  <!-- Actividad 3: Enviar formulario -->
  <rect x="145" y="485" width="220" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)" />
  <text x="255" y="511" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Confirmar envío de promoción</text>

  <!-- ================= CARRIL SISTEMA NUVORA ================= -->
  <!-- Actividad 4: Validar datos -->
  <rect x="585" y="175" width="260" height="52" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
  <text x="715" y="198" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0c4a6e">Validar reglas de negocio</text>
  <text x="715" y="214" text-anchor="middle" font-size="10.5" fill="#334155">(precio oferta &lt; regular, fechas, cupo &gt; 0)</text>

  <!-- Decisión 2: ¿Datos válidos? -->
  <polygon points="715,255 755,285 715,315 675,285" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
  <text x="715" y="282" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">¿Datos</text>
  <text x="715" y="294" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">válidos?</text>

  <!-- Excepción: Mostrar error -->
  <rect x="775" y="345" width="155" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" filter="url(#shadow)" />
  <text x="852" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Mostrar alerta de</text>
  <text x="852" y="384" text-anchor="middle" font-size="10.5" fill="#7f1d1d">error en formulario</text>

  <!-- Decisión 3: ¿Publicar ahora? -->
  <polygon points="620,385 660,415 620,445 580,415" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
  <text x="620" y="412" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">¿Publicar</text>
  <text x="620" y="424" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">ahora?</text>

  <!-- Flujo alterno: Guardar BORRADOR -->
  <rect x="500" y="510" width="180" height="52" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#shadow)" />
  <text x="590" y="533" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Guardar promoción</text>
  <text x="590" y="549" text-anchor="middle" font-size="10.5" fill="#334155">en estado BORRADOR</text>

  <!-- Flujo principal: Guardar ACTIVA -->
  <rect x="720" y="510" width="210" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
  <text x="825" y="533" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Guardar como ACTIVA y</text>
  <text x="825" y="549" text-anchor="middle" font-size="10.5" fill="#14532d">publicar en catálogo visible</text>

  <!-- Unión Final (Merge) -->
  <polygon points="715,610 735,627 715,644 695,627" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" />

  <!-- Nodo Final -->
  <circle cx="715" cy="700" r="14" fill="none" stroke="#0f172a" stroke-width="2" />
  <circle cx="715" cy="700" r="9" fill="#0f172a" />

  <!-- ================= CONECTORES Y GUARDAS ================= -->
  <!-- Inicio -> Act 1 -->
  <line x1="255" y1="151" x2="255" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <!-- Act 1 -> Dec 1 -->
  <line x1="255" y1="227" x2="255" y2="250" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Dec 1 [Sí] -> Act 2 -->
  <polyline points="215,285 157,285 157,340" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="128" y="275" width="40" height="16" fill="#ffffff" />
  <text x="148" y="287" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">[Sí]</text>

  <!-- Dec 1 [No] -> Merge -->
  <polyline points="295,285 360,285 360,442 280,442" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="338" y="355" width="42" height="16" fill="#ffffff" />
  <text x="359" y="367" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">[No]</text>

  <!-- Act 2 -> Merge -->
  <polyline points="157,397 157,442 230,442" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Merge -> Act 3 -->
  <line x1="255" y1="459" x2="255" y2="480" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Act 3 -> Act 4 (cruce entre carriles por corredor libre inferior) -->
  <polyline points="365,507 440,507 440,201 580,201" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Act 4 -> Dec 2 -->
  <line x1="715" y1="227" x2="715" y2="250" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Dec 2 [No - Excepción] -> Error -->
  <polyline points="755,285 852,285 852,340" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="780" y="275" width="70" height="16" fill="#ffffff" />
  <text x="815" y="287" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">[No válido]</text>

  <!-- Error -> Nodo Final (por borde derecho) -->
  <polyline points="852,399 852,465 940,465 940,700 734,700" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <!-- Dec 2 [Sí] -> Dec 3 -->
  <polyline points="675,285 620,285 620,380" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="598" y="325" width="46" height="16" fill="#ffffff" />
  <text x="621" y="337" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">[Válido]</text>

  <!-- Dec 3 [No - Borrador] -> Guardar BORRADOR -->
  <polyline points="580,415 545,415 545,505" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="502" y="455" width="84" height="16" fill="#ffffff" />
  <text x="544" y="467" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">[No / Borrador]</text>

  <!-- Dec 3 [Sí - Publicar] -> Guardar ACTIVA -->
  <polyline points="660,415 825,415 825,505" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="705" y="405" width="80" height="16" fill="#ffffff" />
  <text x="745" y="417" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">[Sí / Publicar]</text>

  <!-- Borrador -> Merge Final -->
  <polyline points="590,562 590,627 690,627" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Activa -> Merge Final -->
  <polyline points="825,562 825,627 740,627" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Merge Final -> Fin -->
  <line x1="715" y1="644" x2="715" y2="682" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)" />

</svg>